<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lỗi hệ thống</title>
<style>
    body {
        font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 15px;
        background: #F0F2F5;
        color: #050505;
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .khung {
        max-width: 480px;
        margin: 16px;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 1px 2px rgba(0,0,0,.2);
        padding: 32px;
        text-align: center;
    }
    h1 { color: #1877F2; font-size: 40px; margin: 0 0 4px; }
    h2 { font-size: 18px; margin: 0 0 12px; }
    .nut {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 9px 16px;
        border-radius: 6px;
        border: none;
        font-weight: 600;
        font-size: 14px;
        text-decoration: none;
        background: #1877F2;
        color: #fff;
        margin-top: 12px;
    }
</style>
</head>
<body>
<div class="khung">
    <h1>500</h1>
    <h2>Lỗi hệ thống</h2>
    <p>Đã có lỗi xảy ra. Vui lòng thử lại sau hoặc liên hệ quản trị hệ thống.</p>
    <a class="nut" href="{% url 'accounts:trang_chu' %}">Về trang chủ</a>
</div>
</body>
</html>
