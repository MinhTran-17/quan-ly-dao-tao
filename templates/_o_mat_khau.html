{% comment %}Ô mật khẩu có nút con mắt hiện/ẩn. Dùng: {% include '_o_mat_khau.html' with truong=form.password %}.

<div class="o-mat-khau">
    {{ truong }}
    <button type="button" class="nut-hien-mat-khau" aria-label="Hiện mật khẩu" aria-controls="{{ truong.id_for_label }}">

            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>

        <svg class="icon-mat-dong" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#65676B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none;">
            <path d="M3 3l18 18"/>
            <path d="M10.6 10.6a3 3 0 0 0 4.2 4.2"/>
            <path d="M9.9 5.1A11 11 0 0 1 12 5c7 0 11 7 11 7a13.2 13.2 0 0 1-3.1 3.9M6.6 6.6C3.7 8.4 1 12 1 12s4 7 11 7a10.5 10.5 0 0 0 4.2-.9"/>
